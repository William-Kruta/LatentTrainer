[project]
name = "latenttrainer"
version = "0.1.0"
description = "Local web interface for SDXL LoRA training"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pillow>=11.0.0",
    "httpx>=0.28.1",
    "nvidia-ml-py>=12.560.30",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "sse-starlette>=2.1.3",
    "uvicorn>=0.32.0",
    "yt-dlp>=2025.1.15",
    "ddgs",
    "numpy>=2.4.4",
    "opencv-python-headless>=4.13.0.92",
]

[tool.setuptools.packages.find]
include = ["app*"]
